# One-click deploy: https://render.com → New → Blueprint → this repo.
# Free tier note (inherited from your-first-instrument ADR-0003): the
# instance sleeps when idle; the first call after a nap takes ~30-60s.
services:
  - type: web
    name: your-first-memory
    runtime: python
    plan: free
    # PINNED — mcp 2.x renamed FastMCP (caught in class 2026-09-10, and again
    # on Render 2026-09-17: buildCommand bypasses pyproject.toml, so the pin
    # must live in BOTH places). psycopg[binary] ships its own libpq.
    # PyJWT[crypto] is the level-3 retrofit: offline token verification.
    buildCommand: pip install "mcp[cli]>=1.2,<2" "psycopg[binary]>=3.1" "PyJWT[crypto]>=2.8"
    startCommand: python server.py
    envVars:
      - key: DATABASE_URL
        sync: false   # Render will ASK you for this at deploy time (ADR-0003):
                      # paste your Neon connection string; it never touches git.
      - key: NEON_AUTH_BASE_URL
        sync: false   # Neon -> your project -> Auth -> Configuration: the one auth URL
                      # (Managed Better Auth, looks like https://…neonauth….neon.tech/neondb/auth).
                      # LEGACY Stack projects: leave empty; set NEON_AUTH_JWKS_URL +
                      # STACK_PUB_CLIENT_KEY in the dashboard instead.
      - key: PUBLIC_URL
        sync: false   # YOUR service URL, e.g. https://your-first-memory-xxxx.onrender.com —
                      # the login/OAuth endpoints advertise this. Render shows it the moment
                      # the service exists; paste it and redeploy if you filled it last.
